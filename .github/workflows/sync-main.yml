name: Sync main into Website Studio

on:
  push:
    branches:
      - phase-4-design-publish

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-design-publish
          fetch-depth: 0
      - name: Merge main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge origin/main --no-edit; then
            git push origin HEAD:phase-4-design-publish
            exit 0
          fi
          git checkout --theirs .github/workflows/tests.yml
          git add .github/workflows/tests.yml
          git commit -m 'Merge main into Website Studio'
          git push origin HEAD:phase-4-design-publish
