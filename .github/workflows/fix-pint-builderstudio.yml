name: Format Builder Studio

on:
  push:
    branches:
      - phase-4-design-publish

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-design-publish
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint app/Livewire/BuilderStudio.php
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Livewire/BuilderStudio.php
          git diff --cached --quiet && exit 0
          git commit -m 'style: format Builder Studio'
          git push origin HEAD:phase-4-design-publish
