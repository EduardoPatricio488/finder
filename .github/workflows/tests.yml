name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Fix Builder Studio Blade compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/views/livewire/builder-studio.blade.php')
          content = path.read_text(encoding='utf-8')
          content = content.replace('{{ $currentPage()[\'name\'] ?? \'Página\' }}', '{{ $this->currentPage()[\'name\'] ?? \'Página\' }}')
          content = content.replace("['document' => $section['settings']['builder_document']]", "['document' => $section['settings']['builder_document'], 'device' => $device]")
          path.write_text(content, encoding='utf-8')
          PY

      - name: Apply Pint formatting
        run: ./vendor/bin/pint --parallel

      - name: Commit formatting and compatibility fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/BuilderStudio.php resources/views/livewire/builder-studio.blade.php
          git commit -m "Fix Builder Studio CI blockers"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"

      - name: Run CI Checks
        run: composer ci:check
