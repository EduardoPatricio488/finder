name: Fix Builder Studio keys

on:
  push:
    branches:
      - phase-4-design-publish

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-design-publish
          fetch-depth: 1
      - name: Add stable Livewire key to builder sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('resources/views/livewire/builder-studio.blade.php')
          text = path.read_text(encoding='utf-8')
          old = 'wire:click="selectSection({{ $i }})" class="group relative border-2'
          new = 'wire:click="selectSection({{ $i }})" wire:key="builder-section-{{ $section[\'id\'] ?? \'new-\'.$i }}" class="group relative border-2'
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Builder section anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/livewire/builder-studio.blade.php
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Builder Studio Livewire section keys'
          git push origin HEAD:phase-4-design-publish
