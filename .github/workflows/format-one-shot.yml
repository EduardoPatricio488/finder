name: format-one-shot

on:
  push:
    branches:
      - phase-4-design-publish

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer setup

      - name: Format changed files
        run: ./vendor/bin/pint app/Livewire/BuilderStudio.php tests/Unit/WebsiteBuilder/SiteSectionDocumentTest.php

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/BuilderStudio.php tests/Unit/WebsiteBuilder/SiteSectionDocumentTest.php
          git commit -m "Format Finder builder files"
          git push
